<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>RefSpec Atlas vocabulary map</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><circle cx='10' cy='10' r='7' fill='%2368a9ff'/></svg>">
  <style>
    :root {
      --ink:#edf4f0; --muted:#9caaa4; --faint:#66756f; --paper:#09100e;
      --rule:#263530; --rule-strong:#3b4f48; --native:#70d29b;
      --serif:ui-serif,Georgia,Cambria,"Times New Roman",serif;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --mono:ui-monospace,"SF Mono",Menlo,monospace;
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{display:grid;grid-template-rows:64px minmax(0,1fr);height:100vh;margin:0;color:var(--ink);background:var(--paper);font:14px/1.5 var(--sans)}
    header{display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.6rem 1.1rem;border-bottom:1px solid var(--rule);background:#0b1310}
    header .back{color:var(--muted);text-decoration:none;font-size:.78rem}header .back:hover{color:var(--ink)}
    header h1{margin:0;font:600 1.05rem/1.2 var(--serif)}
    header .eyebrow{display:block;color:var(--native);font:11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase}
    header .tools{display:flex;gap:.4rem}
    header .tools button{width:34px;height:34px;padding:0;color:var(--muted);border:1px solid var(--rule-strong);border-radius:4px;background:transparent;cursor:pointer}
    header .tools button:hover{color:var(--ink);border-color:var(--native)}
    .toggle-row{display:flex;gap:.4rem;align-items:center;margin-right:.3rem;color:var(--muted);font-size:.78rem;cursor:pointer}.toggle-row input{width:14px;height:14px;margin:0;accent-color:var(--native)}
    main{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(66,112,95,.12),transparent 34rem)}
    canvas{display:block;width:100%;height:100%;cursor:grab}canvas.panning{cursor:grabbing}
    .status{position:absolute;bottom:.7rem;left:.7rem;padding:.35rem .45rem;color:var(--faint);border:1px solid var(--rule);border-radius:4px;background:rgba(9,16,14,.9);font:10px/1.25 var(--mono);pointer-events:none}
    .notice{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);text-align:center}
    .notice b{display:block;color:var(--ink);font:500 1.1rem/1.2 var(--serif)}
    .tooltip{position:fixed;z-index:30;max-width:280px;padding:.5rem .6rem;border:1px solid var(--rule-strong);border-radius:4px;background:rgba(9,16,14,.96);opacity:0;transition:opacity 120ms;pointer-events:none}
    .tooltip.visible{opacity:1}.tooltip b{display:block;font-size:.8rem}.tooltip small{color:var(--faint);font-size:.68rem}
    .inspector{position:absolute;z-index:6;top:.7rem;right:.7rem;bottom:.7rem;width:min(340px,86vw);padding:1rem 1.05rem 1.5rem;overflow:auto;border:1px solid var(--rule);border-radius:4px;background:rgba(14,23,20,.97);scrollbar-color:var(--rule-strong) transparent}
    .inspector h2{margin:0;color:var(--faint);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .inspector-close{float:right;width:26px;height:26px;padding:0;color:var(--muted);border:1px solid var(--rule-strong);border-radius:4px;background:transparent;cursor:pointer}.inspector-close:hover{color:var(--ink);border-color:var(--native)}
    .inspector p{color:var(--muted);font-size:.75rem;line-height:1.5}
    .kicker{margin:1rem 0 .25rem;color:var(--native);font:10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .inspector-title{margin:0 0 .8rem;color:var(--ink);font:500 1.25rem/1.2 var(--serif);overflow-wrap:anywhere}
    .facts{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:.42rem .65rem;margin:.8rem 0}.facts dt{color:var(--faint);font-size:.7rem}.facts dd{margin:0;overflow-wrap:anywhere;color:var(--muted)}
    .connections{display:grid;gap:.35rem;margin-top:.6rem}.connection{width:100%;padding:.5rem;color:var(--muted);border:0;border-left:2px solid var(--edge,var(--native));background:rgba(255,255,255,.025);text-align:left;cursor:pointer}.connection:hover{color:var(--ink);background:rgba(255,255,255,.055)}.connection b,.connection span,.connection small{display:block}.connection b{color:var(--ink);font-size:.78rem}.connection span{margin-top:.18rem}.connection small{margin-top:.22rem;color:var(--faint);font:10px/1.35 var(--mono)}
    .relation-brief{margin-top:.75rem;border-top:1px solid var(--rule-strong)}.brief-block{padding:.68rem 0;border-bottom:1px solid var(--rule)}.brief-block h4{margin:0 0 .32rem;color:var(--faint);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}.brief-block p{margin:0}.brief-lead{color:var(--ink);font:500 1rem/1.42 var(--serif)}
    .evidence-row{padding:.62rem 0;border-top:1px solid var(--rule)}.evidence-row a{color:var(--native)}.evidence-row b{display:block;color:var(--ink);font-size:.75rem}.evidence-row p{margin:.22rem 0 0}
    .tag-list{display:flex;flex-wrap:wrap;gap:.3rem}.tag{padding:.2rem .42rem;color:var(--muted);border:1px solid var(--rule-strong);border-radius:999px;font-size:.66rem}
    .technical{margin-top:.75rem;padding-top:.55rem;border-top:1px solid var(--rule)}.technical summary{color:var(--faint);font-size:.7rem;cursor:pointer}.technical small{display:block;margin-top:.55rem;color:var(--faint);font-size:.62rem}.technical code{display:block;margin-top:.18rem;color:var(--muted);font:10px/1.45 var(--mono);overflow-wrap:anywhere}
    .actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}.action{padding:.45rem .6rem;color:var(--muted);border:1px solid var(--rule-strong);border-radius:4px;background:transparent;cursor:pointer}.action:hover{color:var(--ink);border-color:var(--native)}
    .hint{margin:.55rem 0 0;color:var(--faint);font-size:.72rem}
  </style>
</head>
<body>
<header>
  <div><a class="back" href="/">← Atlas explorer</a><span class="eyebrow">RefSpec vocabulary Atlas</span><h1 id="title">Vocabulary map</h1></div>
  <div class="tools"><label class="toggle-row" id="show-deprecated-wrap"><input type="checkbox" id="show-deprecated"><span>Show deprecated</span></label><button type="button" id="zoom-in" aria-label="Zoom in">+</button><button type="button" id="zoom-out" aria-label="Zoom out">−</button><button type="button" id="fit" aria-label="Fit the whole vocabulary">⌂</button></div>
</header>
<main><canvas id="map" tabindex="0" role="img" aria-label="Every concept in this vocabulary"></canvas><div class="notice" id="notice"><div><b>Loading the whole vocabulary…</b>Large vocabularies take a moment.</div></div><aside class="inspector" id="inspector" hidden aria-label="Concept inspector"><button type="button" class="inspector-close" id="inspector-close" aria-label="Close inspector">×</button><h2 id="inspector-heading">Concept inspector</h2><div id="detail"></div></aside><div class="status" id="status" hidden></div></main>
<div class="tooltip" id="tooltip"></div>
<script src="/assets/data-layer.js"></script>
<script>
(() => {
  "use strict";
  const $=selector=>document.querySelector(selector),format=value=>new Intl.NumberFormat("en-US").format(value),plural=(count,word)=>count===1?word:`${word}s`;
  const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const short=value=>String(value??"").split(/[#/:]/).filter(Boolean).pop()||String(value??"");
  const humanize=value=>String(value??"").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/[-_]/g," ").replace(/^./,char=>char.toUpperCase());
  const canvas=$("#map"),ctx=canvas.getContext("2d"),tooltip=$("#tooltip"),notice=$("#notice"),status=$("#status"),inspector=$("#inspector"),detail=$("#detail");
  const releaseColors=["#78c7b6","#d8ad62","#83aee1","#d38fae","#9fca72","#c596e5","#e28b6f","#72c5d8"],releaseNames=new Map(),resourceCache=new Map();
  const showDeprecated=$("#show-deprecated");

  function hash(value){let result=2166136261;for(const char of String(value)){result^=char.codePointAt(0);result=Math.imul(result,16777619)}return result>>>0}
  function sourceName(value){const name=releaseNames.get(value)||short(value),aliases=[[/^elsst-/,"ELSST"],[/^eurovoc-domains-/,"EuroVoc domains"],[/^eurovoc-/,"EuroVoc"],[/^fast-/,"FAST"],[/^mesh-/,"MeSH"],[/^opm-ehri-/,"OPM data standards"],[/^federal-register-api-topics-/,"Federal Register topics"],[/^federal-register-thesaurus-/,"Federal Register thesaurus"]];for(const[pattern,label]of aliases)if(pattern.test(name))return label;return humanize(name.replace(/-20\d\d(?:-\d\d-\d\d)?$/,""))}
  const typeColor={NativeRelationAssertion:"#70d29b",MappingAssertion:"#68a9ff",CrossRingRelationAssertion:"#e7ad55",SourceAssignment:"#8b9792"};
  function relationLabel(value){const labels={thesaurusUse:"Use",thesaurusUsedFor:"Used for",assignedSubject:"Assigned subject",assignedEntity:"Assigned entity",exactMatch:"Exact match",closeMatch:"Close match"};return labels[short(value)]||humanize(short(value))}

  async function get(path){return await window.AtlasData.get(path)}
  const labelOf=resource=>resource.labels?.find(row=>row.role==="preferred")?.value||resource.labels?.[0]?.value||resource.label||short(resource.id);
  function facts(rows){return`<dl class="facts">${rows.filter(row=>row[1]!==null&&row[1]!==undefined&&row[1]!=="").map(([name,value])=>`<dt>${esc(name)}</dt><dd>${esc(value)}</dd>`).join("")}</dl>`}
  function normalizedConnection(resource,edge){const key=short(edge.predicate),subject=edge.subject===resource.id,other=subject?edge.object:edge.subject,otherLabel=(subject?edge.object_label:edge.subject_label)||short(other);let label=relationLabel(edge.predicate);if(key==="broader")label=subject?"Broader":"Narrower";if(key==="narrower")label=subject?"Narrower":"Broader";return{edge,key:`${label}|${other}`,label,otherLabel}}

  function relationWhy(edge){return{NativeRelationAssertion:"The source vocabulary publishes this relationship.",MappingAssertion:"A publisher supplies this link between two vocabularies.",CrossRingRelationAssertion:"Atlas preserves this relationship between different resource kinds.",SourceAssignment:"The source record assigns this resource."}[edge.statement_type]||"Atlas preserves this source relationship."}
  const state={nodes:[],edges:[],predicates:[],types:[],adjacency:[],indexById:new Map(),grid:new Map(),bucket:64,color:"#78c7b6",view:{x:0,y:0,k:1},hover:-1,selected:-1,drag:null,bounds:null};
  const channel="BroadcastChannel"in window?new BroadcastChannel("refspec-atlas-open"):null;let pendingAck=null;
  function setOpenStatus(text){const element=$("#open-status");if(element)element.textContent=text}

  async function selectNode(index){state.selected=index;if(index<0){inspector.hidden=true;draw();return}draw();inspector.hidden=false;$("#inspector-heading").textContent="Concept inspector";const id=state.nodes[index].id;if(!resourceCache.has(id)){detail.innerHTML='<p class="hint">Loading concept…</p>';try{resourceCache.set(id,await get(`/api/resource?id=${encodeURIComponent(id)}&status=${statusParam()}`))}catch(error){detail.innerHTML=`<p class="hint">${esc(error.message)}</p>`;return}if(state.selected!==index)return}showConceptInspector(index)}
  function inspectorActions(){return`<div class="actions"><button type="button" class="action" id="detail-open">Open in Atlas explorer ↗</button></div><p class="hint" id="open-status"></p>`}
  function showConceptInspector(index){const resource=resourceCache.get(state.nodes[index].id);if(!resource)return;const groups=connectionGroups(resource),aliases=resource.labels.filter(row=>row.role!=="preferred");$("#inspector-heading").textContent="Concept inspector";detail.innerHTML=`<div class="kicker">${esc(sourceName(resource.release))} · ${esc(humanize(resource.ring))}</div><h3 class="inspector-title">${esc(labelOf(resource))}</h3>${resource.definition?`<p>${esc(resource.definition)}</p>`:""}${facts([["Source",sourceName(resource.release)],["Relations",resource.relations.length],["Notations",(resource.notations||[]).join(", ")],["Status",resource.status&&resource.status!=="active"?humanize(resource.status):""]])}${inspectorActions()}${groups.length?`<div class="connections">${groups.map((group,groupIndex)=>`<button class="connection" data-group="${groupIndex}" style="--edge:${relationColor(group.edge)}"><b>${esc(group.label)}</b><span>${esc(group.otherLabel)}</span><small>${group.edges.length>1?`${group.edges.length} equivalent assertions · `:""}${esc(sourceName(group.edge.source_release))}</small></button>`).join("")}</div>`:""}${aliases.length?`<div class="kicker">Also known as</div><div class="tag-list">${aliases.map(row=>`<span class="tag">${esc(row.value)}</span>`).join("")}</div>`:""}<details class="technical"><summary>Identifier</summary><code>${esc(resource.id)}</code></details>`;$("#detail-open").onclick=openSelected;detail.querySelectorAll("[data-group]").forEach(button=>button.onclick=()=>showEdgeDetail(index,groups[Number(button.dataset.group)]))}
  function showEdgeDetail(index,group){const resource=resourceCache.get(state.nodes[index].id),edge={...group.edge,label:group.label},assertions=group.edges,evidence=assertions.flatMap(row=>row.evidence||[]),subject=edge.subject_label||short(edge.subject),object=edge.object_label||short(edge.object),otherId=edge.subject===resource.id?edge.object:edge.subject,otherIndex=state.indexById.get(otherId);$("#inspector-heading").textContent="Relation inspector";detail.innerHTML=`<div class="kicker">${esc(humanize(edge.statement_type))}</div><h3 class="inspector-title">${esc(edge.label)}</h3><div class="relation-brief"><div class="brief-block"><h4>Relationship</h4><p class="brief-lead">${esc(subject)} → ${esc(object)}</p></div><div class="brief-block"><h4>Meaning</h4><p>${esc(relationMeaning(edge))}</p></div><div class="brief-block"><h4>Why it is here</h4><p>${esc(relationWhy(edge))}</p></div></div>${facts([["Source",sourceName(edge.source_release)],["Assertions",assertions.length],["Evidence",evidence.length]])}<div class="actions"><button type="button" class="action" id="detail-back">← ${esc(labelOf(resource))}</button>${otherIndex!==undefined?`<button type="button" class="action" id="detail-goto">View ${esc(group.otherLabel)} here</button>`:""}</div>${evidence.length?`<div class="kicker">Evidence</div>${evidence.map(item=>`<div class="evidence-row"><b>${esc([humanize(short(item.evidenceRole)),humanize(short(item.decision))].filter(Boolean).join(" · "))}</b><p>${item.sourceLocator&&/^https?:/.test(item.sourceLocator)?`<a href="${esc(item.sourceLocator)}" target="_blank" rel="noopener">Open source record</a>`:esc(sourceName(item.sourceRelease))}</p></div>`).join("")}`:""}<details class="technical"><summary>Identifiers</summary><small>Relation ID</small><code>${esc(edge.id)}</code><small>Property ID</small><code>${esc(edge.predicate)}</code></details>`;$("#detail-back").onclick=()=>showConceptInspector(index);const gotoButton=$("#detail-goto");if(gotoButton)gotoButton.onclick=()=>{selectNode(otherIndex);centerOn(otherIndex)}}
  function centerOn(index){const node=state.nodes[index],k=Math.max(state.view.k,1.4),target={x:-node.x*k,y:-node.y*k,k},from={...state.view},started=performance.now(),tick=now=>{const t=Math.min(1,(now-started)/220),ease=1-Math.pow(1-t,3);state.view={x:from.x+(target.x-from.x)*ease,y:from.y+(target.y-from.y)*ease,k:from.k+(target.k-from.k)*ease};draw();if(t<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
  function openSelected(){if(state.selected<0)return;const id=state.nodes[state.selected].id,url=`/?open=${encodeURIComponent(id)}`;if(channel){pendingAck=id;channel.postMessage({type:"open",id});setOpenStatus("Sending to your explorer tab…");setTimeout(()=>{if(pendingAck===id){pendingAck=null;setOpenStatus("Opened in a new tab.");window.open(url,"_blank","noopener")}},400)}else window.open(url,"_blank","noopener")}
  const golden=2.399963229728653,SPIRAL_SPACING=12,FORCE_LIMIT=900,EDGE_ALWAYS=8000,EDGE_VISIBLE_LIMIT=3500,LABEL_LIMIT=250,DOT_LIMIT=4000;
  function layout(){const nodes=state.nodes;if(nodes.length<=FORCE_LIMIT&&state.edges.length){nodes.forEach((node,i)=>{const theta=i*golden+(hash(node.id)%628)/100,radius=26*Math.sqrt(i);node.x=Math.cos(theta)*radius;node.y=Math.sin(theta)*radius});for(let iter=0;iter<120;iter++){const heat=1-iter/120;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<1){dx=((hash(a.id+b.id)%100)-50)/50||.5;dy=.5;d2=dx*dx+dy*dy}const d=Math.sqrt(d2),push=(Math.min(18,900/d2)+(d<24?(24-d)*.5:0))*heat,ux=dx/d,uy=dy/d;a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push}for(const edge of state.edges){const a=nodes[edge[0]],b=nodes[edge[1]],dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),pull=(d-70)*.04,ux=dx/d,uy=dy/d;a.x+=ux*pull;a.y+=uy*pull;b.x-=ux*pull;b.y-=uy*pull}}}else nodes.forEach((node,i)=>{const theta=i*golden,radius=SPIRAL_SPACING*Math.sqrt(i);node.x=Math.cos(theta)*radius;node.y=Math.sin(theta)*radius});let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;state.grid.clear();nodes.forEach((node,i)=>{minX=Math.min(minX,node.x);maxX=Math.max(maxX,node.x);minY=Math.min(minY,node.y);maxY=Math.max(maxY,node.y);const key=`${Math.floor(node.x/state.bucket)}|${Math.floor(node.y/state.bucket)}`;const cell=state.grid.get(key);if(cell)cell.push(i);else state.grid.set(key,[i])});state.bounds=nodes.length?{minX,maxX,minY,maxY}:null}
  function screen(node){const box=canvas.getBoundingClientRect();return{x:box.width/2+state.view.x+node.x*state.view.k,y:box.height/2+state.view.y+node.y*state.view.k}}

  function drawEdge(edge,alpha){const a=state.nodes[edge[0]],b=state.nodes[edge[1]],from=screen(a),to=screen(b);ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.strokeStyle=typeColor[state.types[edge[3]]]||"#70d29b";ctx.globalAlpha=alpha;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1}
  function drawLabel(node,point,radius){ctx.font="11px Inter,system-ui";ctx.textBaseline="middle";const x=point.x+radius+5,width=ctx.measureText(node.label).width;ctx.fillStyle="rgba(5,10,8,.88)";ctx.fillRect(x-2,point.y-8,width+4,16);ctx.fillStyle=state.color;ctx.fillText(node.label,x,point.y)}
  function draw(){const box=canvas.getBoundingClientRect();ctx.clearRect(0,0,box.width,box.height);if(!state.nodes.length)return;const visible=visibleNodes(),radius=nodeRadius(),drawEdges=state.edges.length&&(state.edges.length<=EDGE_ALWAYS||visible.length<=EDGE_VISIBLE_LIMIT);if(drawEdges){const seen=new Set();for(const i of visible)for(const edgeIndex of state.adjacency[i]||[]){if(seen.has(edgeIndex))continue;seen.add(edgeIndex);drawEdge(state.edges[edgeIndex],.16)}}if(visible.length>DOT_LIMIT){ctx.fillStyle=state.color;const size=Math.max(1.6,radius*.8);for(const i of visible){const point=screen(state.nodes[i]);ctx.fillRect(point.x-size/2,point.y-size/2,size,size)}}else for(const i of visible){const point=screen(state.nodes[i]);ctx.beginPath();ctx.arc(point.x,point.y,radius,0,Math.PI*2);ctx.fillStyle=state.color;ctx.globalAlpha=.92;ctx.fill();ctx.globalAlpha=1;if(radius>3){ctx.strokeStyle="rgba(4,8,7,.85)";ctx.lineWidth=1;ctx.stroke()}}if(visible.length<=LABEL_LIMIT)for(const i of visible){if(i===state.hover||i===state.selected)continue;drawLabel(state.nodes[i],screen(state.nodes[i]),radius)}const focus=[];if(state.selected>=0)focus.push(state.selected);if(state.hover>=0&&state.hover!==state.selected)focus.push(state.hover);for(const focusIndex of focus){const node=state.nodes[focusIndex],point=screen(node);for(const edgeIndex of state.adjacency[focusIndex]||[]){const edge=state.edges[edgeIndex];drawEdge(edge,.85);const otherIndex=edge[0]===focusIndex?edge[1]:edge[0],other=state.nodes[otherIndex];drawLabel(other,screen(other),radius)}ctx.beginPath();ctx.arc(point.x,point.y,radius+4,0,Math.PI*2);ctx.fillStyle=focusIndex===state.selected?"rgba(112,210,155,.22)":"rgba(153,221,208,.16)";ctx.fill();ctx.beginPath();ctx.arc(point.x,point.y,Math.max(radius,3.5),0,Math.PI*2);ctx.fillStyle=state.color;ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=focusIndex===state.selected?2:1.5;ctx.stroke();drawLabel(node,point,radius+2)}status.hidden=false;status.textContent=`${format(state.nodes.length)} ${plural(state.nodes.length,"concept")} · ${format(state.edges.length)} ${plural(state.edges.length,"relation")} · ${format(visible.length)} in view${state.edges.length&&!drawEdges?" · zoom in to see relations":""}`}
  function fit(animate=true){if(!state.bounds)return;const box=canvas.getBoundingClientRect(),{minX,maxX,minY,maxY}=state.bounds,k=Math.min(1.6,Math.max(.002,Math.min((box.width-90)/(maxX-minX+70),(box.height-100)/(maxY-minY+70)))),target={x:-(minX+maxX)/2*k,y:-(minY+maxY)/2*k,k},from={...state.view},started=performance.now(),tick=now=>{const t=animate?Math.min(1,(now-started)/220):1,ease=1-Math.pow(1-t,3);state.view={x:from.x+(target.x-from.x)*ease,y:from.y+(target.y-from.y)*ease,k:from.k+(target.k-from.k)*ease};draw();if(t<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
  function zoom(factor){state.view.k=Math.max(.001,Math.min(600,state.view.k*factor));draw()}
  function hitNode(x,y){const point=world(x,y),reach=Math.max(nodeRadius()+18,28)/state.view.k,span=Math.min(3,Math.ceil(reach/state.bucket)),col=Math.floor(point.x/state.bucket),row=Math.floor(point.y/state.bucket);let best=-1,bestDistance=reach;for(let dc=-span;dc<=span;dc++)for(let dr=-span;dr<=span;dr++){const cell=state.grid.get(`${col+dc}|${row+dr}`);if(cell)for(const i of cell){const node=state.nodes[i],distance=Math.hypot(point.x-node.x,point.y-node.y);if(distance<bestDistance){best=i;bestDistance=distance}}}return best}
  function resize(){const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
  canvas.addEventListener("pointerdown",event=>{canvas.setPointerCapture(event.pointerId);state.drag={x:event.clientX,y:event.clientY,vx:state.view.x,vy:state.view.y,moved:false};canvas.classList.add("panning")});
  canvas.addEventListener("pointermove",event=>{const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;if(state.drag){const dx=event.clientX-state.drag.x,dy=event.clientY-state.drag.y;if(Math.hypot(dx,dy)>3)state.drag.moved=true;state.view.x=state.drag.vx+dx;state.view.y=state.drag.vy+dy;draw();return}state.hover=hitNode(x,y);canvas.style.cursor=state.hover>=0?"pointer":"grab";if(state.hover<0)tooltip.classList.remove("visible");else{const node=state.nodes[state.hover],degree=(state.adjacency[state.hover]||[]).length;tooltip.innerHTML=`<b>${esc(node.label)}</b><small>${format(degree)} ${plural(degree,"relation")} · select to inspect</small>`;tooltip.style.left=Math.min(event.clientX,innerWidth-290)+"px";tooltip.style.top=Math.min(event.clientY,innerHeight-70)+"px";tooltip.classList.add("visible")}draw()});
  canvas.addEventListener("pointerup",event=>{const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;if(state.drag&&!state.drag.moved)selectNode(hitNode(x,y));state.drag=null;canvas.classList.remove("panning")});
  canvas.addEventListener("pointerleave",()=>{if(!state.drag){state.hover=-1;tooltip.classList.remove("visible");draw()}});
  canvas.addEventListener("wheel",event=>{event.preventDefault();const rect=canvas.getBoundingClientRect(),before=world(event.clientX-rect.left,event.clientY-rect.top);state.view.k=Math.max(.002,Math.min(60,state.view.k*Math.exp(-event.deltaY*.001)));const after=screen(before);state.view.x+=event.clientX-rect.left-after.x;state.view.y+=event.clientY-rect.top-after.y;draw()},{passive:false});
  $("#zoom-in").onclick=()=>zoom(1.2);$("#zoom-out").onclick=()=>zoom(.82);$("#fit").onclick=()=>fit(true);$("#inspector-close").onclick=()=>selectNode(-1);window.addEventListener("keydown",event=>{if(event.key==="Escape")selectNode(-1)});
  new ResizeObserver(()=>resize()).observe(canvas);
  let releaseId=null;
  async function loadRelease(){if(!releaseId)throw new Error("Missing ?id= vocabulary release identifier.");resourceCache.clear();selectNode(-1);const[data,facets]=await Promise.all([get(`/api/release-graph?id=${encodeURIComponent(releaseId)}&status=${statusParam()}`),get("/api/facets").catch(()=>null)]);if(facets)facets.releases.forEach(row=>releaseNames.set(row.id,row.identifier));releaseNames.set(data.release.id,data.release.identifier);state.predicates=data.predicates;state.types=data.types;state.nodes=data.nodes.map(([id,label])=>({id,label,x:0,y:0}));state.edges=data.edges;state.indexById=new Map(state.nodes.map((node,index)=>[node.id,index]));state.adjacency=state.nodes.map(()=>[]);data.edges.forEach((edge,edgeIndex)=>{state.adjacency[edge[0]].push(edgeIndex);state.adjacency[edge[1]].push(edgeIndex)});const name=sourceName(data.release.id);state.color=name==="ELSST"?"#78c7b6":name==="EuroVoc"?"#d8ad62":name==="FAST"?"#83aee1":name==="MeSH"?"#d38fae":releaseColors[hash(data.release.id)%releaseColors.length];$("#title").textContent=name;document.title=`${name} · RefSpec Atlas vocabulary map`;
    let truncationNote=document.getElementById("truncation-note");
    if(data.truncated){
      if(!truncationNote){truncationNote=document.createElement("small");truncationNote.id="truncation-note";truncationNote.style.cssText="display:block;margin-top:.2rem;color:var(--faint);font:11px/1.3 var(--mono)";$("#title").insertAdjacentElement("afterend",truncationNote)}
      truncationNote.textContent=`Showing top ${format(data.nodes.length)} of ${format(data.counts.totalResources)} concepts, ranked by connections`;
      truncationNote.hidden=false;
    } else if(truncationNote){truncationNote.hidden=true}
    layout();notice.hidden=true;resize();fit(false);if(data.counts.droppedRelations)console.warn(`${data.counts.droppedRelations} relations reference resources outside this vocabulary and are not drawn.`)}
  function showLoadError(error){notice.hidden=false;notice.innerHTML=`<div><b>Cannot draw this vocabulary</b>${esc(error.message)}</div>`}
  showDeprecated.addEventListener("change",()=>loadRelease().catch(showLoadError));
  (async()=>{releaseId=new URLSearchParams(location.search).get("id");await loadRelease()})().catch(showLoadError);
})();
