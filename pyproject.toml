[project]
name = "refspec"
version = "0.1.0.dev0"
description = "Managed vocabulary releases, crosswalks, and static atlas assets for RefSpec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.1,<8",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff==0.3.4",
]

[project.scripts]
refspec-build-federal-register-2025 = "refspec.cli:main"
refspec-build-vocabulary-atlas = "refspec.atlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"refspec.fixtures" = ["*.json", "*.jsonld"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
