[project]
name = "refspec"
version = "0.1.0.dev0"
description = "Reference implementation and bindings for the Regulatory Evidence Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backports-zstd==1.6.0; python_version < '3.14'",
    "duckdb>=1.5.0,<2",
    "jsonschema>=4.26,<5",
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
    "pyarrow==23.0.0",
    "rdflib>=7.1,<8",
    "referencing>=0.37,<1",
    "typing-extensions>=4.12,<5",
    "pymarc>=5.1,<6",
    "rulespec-conformance==0.2.0rc18",
    # Not imported anywhere in RefSpec. rulespec-conformance rc16/rc17 require it,
    # and a [tool.uv.sources] entry only binds a DIRECT dependency, so the
    # vendored wheel is unreachable unless it is named here. See vendor/README.md.
    "rulespec-artifacts==1.0.9",
]

[project.scripts]
refspec-atlas-explorer = "refspec.atlas.explorer_cli:main"
refspec-verify-atlas-parquet-view = "refspec.atlas.parquet_view_cli:main"
refspec-build-atlas-search-view = "refspec.atlas.parquet_search_view_cli:main"
refspec-validate-atlas-parquet = "refspec.atlas.parquet_preflight_cli:main"
refspec-validate = "refspec.binding:main"
refspec-release-graph-gate = "refspec.release_graph:main"

[tool.uv.sources]
# Vendored until a package index exists for rulespec-conformance. See
# vendor/README.md for why, and for the bump procedure. The path is
# relative so `uv lock`/`uv sync --frozen` are hermetic on CI runners,
# which have no ~/Work/rulespec checkout.
rulespec-conformance = { path = "vendor/rulespec_conformance-0.2.0rc18-py3-none-any.whl" }
# rc16 declared a hard `rulespec-artifacts==1.0.9` dependency that rc15 did not
# (it arrived with the shared platform-artifact protocol, not with this
# contract change). Nothing in RefSpec imports it — rulespec_conformance only
# reaches for it lazily, inside three platform-artifact helpers we never call —
# but a declared dependency still has to resolve, and it is on no index either.
# So it is vendored on the same terms and dies with the same index.
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.0.9-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-xdist>=3.6,<4",
    # Six frontier/benchmark test modules import these directly; they were
    # previously satisfied out-of-band by the dev venv, which broke any clean
    # `uv sync --frozen` checkout (including CI). Declared where they are used.
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    # Pinned exactly. `make lint` gates the tree, so a ruff release that adds a
    # rule would otherwise fail the build with no change to this repository.
    # Moving the pin is how new rules get adopted: deliberately, in one commit.
    "ruff==0.16.0",
    # Six test modules import the Atlas 3.0 binding validator directly. It needs
    # these, and they are pinned to the exact versions in
    # bindings/atlas/3.1/requirements.txt so the validator behaves identically
    # under `make test-package` and under `make test-atlas-v3`.
    "owlrl==7.1.4",
    "pyshacl==0.31.0",
    # A SECOND, INDEPENDENT RDF parser, for `make lint-rdf-strict` only. Nothing
    # this repository publishes may depend on it: the published bytes are
    # written and read by rdflib, and pyoxigraph is here to disagree with rdflib
    # about what those bytes mean. That is the whole value -- the oxigraph spike
    # found two wire defects (over-escaped IRIs, non-simple literal forms) that
    # rdflib round-tripped happily. Pinned exactly for the same reason ruff is:
    # this is a gate, so a parser release that tightens a rule arrives as a
    # deliberate bump rather than as a red build nobody asked for.
    "pyoxigraph==0.5.9",
]

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reads or derives from a large pinned real source; runs in the audit tier, excluded from test-package",
]

[tool.ruff]
line-length = 120
# One-off trace scripts, written to be read once beside their findings. They are
# not importable, not packaged, and nothing runs them again; the ledger owns that
# directory. Everything a consumer can reach is inside the default scope.
extend-exclude = ["research"]

[tool.ruff.lint]
# Stated, not inherited. Ruff curates its own default set per release -- today it
# resolves to 413 rules drawn as subsets of ~37 families -- so a version bump
# would silently redefine what this gate means. These are whole families, chosen
# for the failure classes this repository actually has, so a new rule inside one
# of them arrives as a finding rather than as a rule nobody selected.
select = [
    "F",                  # pyflakes: undefined names, unused imports
    "E4", "E7", "E9", "W",  # pycodestyle errors and warnings (E1-E3 are layout)
    "I",                  # deterministic import order
    "UP",                 # pyupgrade: keeps the 3.12 floor honest
    "FURB",               # modernizations pyupgrade does not cover
    "B",                  # bugbear: mutable defaults, unstrict zip, bare re-raise
    "BLE",                # blind except -- the tree already annotates these
    "C4",                 # comprehensions
    "SIM", "PIE", "RET", "ISC", "FLY",
    "DTZ",                # naive datetimes: every timestamp here is digested
    "LOG", "G",           # logging call shape
    "ASYNC", "YTT", "INT", "FA", "PGH", "RSE", "SLOT", "TID", "EXE",
    "RUF",                # ruff's own, including RUF100 for dead `noqa`
]
ignore = [
    # Tests and standalone tools bootstrap sys.path before importing the module
    # under test; the imports cannot move above that.
    "E402",
    # The explorer frontend and the regulatory sources carry deliberate
    # typography (multiplication sign, minus sign, en dash). They are the text.
    "RUF001", "RUF002", "RUF003",
    # `pytest.raises(match=...)` is used here with real regexes -- alternations
    # and `.*` -- which the rule cannot tell apart from an unescaped literal.
    "RUF043",
    # The rule reads any SCREAMING_CASE name as a constant, so it wants
    # `assert {...} == PUBLISHED_SET` -- backwards, since the module constant is
    # the thing under test and the literal is the expectation.
    "SIM300",
]
