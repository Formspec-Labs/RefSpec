[project]
name = "refspec"
version = "0.1.0.dev0"
description = "Reference implementation and bindings for the Regulatory Evidence Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "backports-zstd==1.6.0; python_version < '3.14'",
    "duckdb==1.5.0",
    "jsonschema>=4.26,<5",
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
    "pyarrow==23.0.0",
    "rdflib>=7.1,<8",
    "referencing>=0.37,<1",
    "typing-extensions>=4.12,<5",
    "pymarc>=5.1,<6",
]

[project.scripts]
refspec-atlas-explorer = "refspec.atlas.explorer_cli:main"
refspec-build-atlas-parquet-view = "refspec.atlas.parquet_view_cli:main"
refspec-build-atlas-search-view = "refspec.atlas.parquet_search_view_cli:main"
refspec-validate-atlas-parquet = "refspec.atlas.parquet_preflight_cli:main"
refspec-validate = "refspec.binding:main"
refspec-release-graph-gate = "refspec.release_graph:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.12,<1",
    "sssom>=0.4,<1",
    # Six test modules import the Atlas 3.0 binding validator directly. It needs
    # these, and they are pinned to the exact versions in
    # bindings/atlas/3.0/requirements.txt so the validator behaves identically
    # under `make test-package` and under `make test-atlas-v3`.
    "owlrl==7.1.4",
    "pyshacl==0.31.0",
]

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
