[project]
name = "refspec"
version = "0.1.0.dev0"
description = "Operational vocabulary releases and source-term resolution for RefSpec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
refspec-build-federal-register-2025 = "refspec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"refspec.fixtures" = ["*.json", "*.jsonld"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
