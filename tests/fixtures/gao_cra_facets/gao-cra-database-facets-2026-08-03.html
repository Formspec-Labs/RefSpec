<!DOCTYPE html>
<html lang="en">
<head>
<title>Congressional Review Act | U.S. GAO</title>
<link rel="canonical" href="https://www.gao.gov/legal/other-legal-work/congressional-review-act"/>
</head>
<body>
<main>
<h1>Congressional Review Act</h1>
<p>Search GAO's records of rules submitted for congressional review.</p>
<form class="views-exposed-form" method="get" id="views-exposed-form-cra-database-page-1" accept-charset="UTF-8">
<div class="js-form-item js-form-type-select js-form-item-priority form-item form-item-priority form-type-select">
<label for="edit-priority">Priority</label>
<select id="edit-priority" name="priority" class="form-select">
<option value="all" selected="selected">- Any -</option>
<option value="major">Major</option>
<option value="non-major">Non-major</option>
</select>
</div>
<div class="js-form-item js-form-type-select js-form-item-processed form-item form-item-processed form-type-select">
<label for="edit-processed">Processed</label>
<select id="edit-processed" name="processed" class="form-select">
<option value="1" selected="selected">Yes</option>
<option value="0">No</option>
</select>
</div>
<div class="js-form-item js-form-type-select js-form-item-type form-item form-item-type form-type-select">
<label for="edit-type">Type</label>
<select id="edit-type" name="type" class="form-select">
<option value="all" selected="selected">- Any -</option>
<option value="rule">Rule</option>
<option value="report">Report on Major Rule</option>
<option value="decision">Legal Decision</option>
<option value="disapproved">Disapproved by Joint Resolution</option>
</select>
</div>
<input type="submit" value="Apply" class="button js-form-submit form-submit"/>
</form>
<table class="views-table">
<thead>
<tr><th>Priority</th><th>Rule Title</th><th>Agency</th><th>Received Date</th><th>Effective Date</th></tr>
</thead>
<tbody>
</tbody>
</table>
</main>
</body>
</html>
