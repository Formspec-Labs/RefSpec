name: CI

# Pushes to main and pull requests, not both for one change: a pull request's
# own push would otherwise run every job twice. The full-Atlas tier runs weekly
# and on demand (REF-071).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the older run; main keeps
# every run, so each merge still gets its verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job runs one tier, conftest.tier_of, through its `make` target, so CI and
# a developer's `make` run the same selection; tests/test_test_tiers.py checks
# that every tier has a job here. Each job starts from a clean clone plus the
# pinned inputs .github/actions/pinned-setup fetches from R2. The rest of the
# gitignored `output/` tree (derived builds and unpinned captures) is never
# present, so a step that reads it fails with a missing file rather than a
# finding; `audit-registry-real-data` rewrites sealed evidence and stays the
# owner's run.
jobs:
  bounded-gates:
    name: Bounded gates
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up with the pinned inputs
        uses: ./.github/actions/pinned-setup
        with:
          r2-access-key-id: ${{ secrets.REFSPEC_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.REFSPEC_R2_SECRET_ACCESS_KEY }}

      - name: Check source and machine files
        run: make lint

      - name: Check generated files against their generators
        run: make check-generated

      # A second RDF parser, with no code in common with the producer, reading
      # the bytes rdflib wrote. Every other RDF gate here is rdflib checking
      # itself, which cannot catch what rdflib is willing to round-trip -- the
      # oxigraph spike found two such classes (over-escaped IRIs, non-simple
      # literal forms) in bytes that had already passed acceptance. On this
      # runner the only RDF artifact in reach is the committed
      # bindings/atlas/3.1/tests/registry-descriptors.nq, which is exactly the
      # wire grammar's sentinel: a sealed bundle member and a digest-pinned
      # build input. Distributions are gitignored and never present here; the
      # same target sweeps their packs locally via ATLAS_RDF_STRICT_ROOTS.
      - name: Parse the committed RDF with a second, independent parser
        run: make lint-rdf-strict

      - name: Audit the registry manifest against the code
        run: make audit-registry-inventory

      - name: Validate the JSON 1.0 binding
        run: make test-json-binding

      # `make test-package` builds the Federal Register Thesaurus release it reads
      # (seconds) and runs the fast tier. The report is written outside the
      # checkout for the skip check; the runaway guard is raised because a hosted
      # runner is not the machine it was measured on, and the job timeout guards.
      - name: Run the fast tier
        run: make test-package PYTEST_ARGS="--junitxml=$RUNNER_TEMP/pytest.xml" TEST_PACKAGE_FAIL_SECONDS=1200

      - name: Check skips against the fast tier's allowlist
        run: uv run python tools/check_skips.py "$RUNNER_TEMP/pytest.xml" --tier fast

  real-data-tier:
    name: Real-data tier
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up with the pinned inputs
        uses: ./.github/actions/pinned-setup
        with:
          r2-access-key-id: ${{ secrets.REFSPEC_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.REFSPEC_R2_SECRET_ACCESS_KEY }}

      # `make test-slow` builds every derived artifact the tier reads at HEAD (the
      # FR Thesaurus release, the Unified Agenda Parquet artifact and the
      # EuroVoc/GEMET claim releases) and runs it on SLOW_WORKERS workers.
      - name: Run the slow tier
        run: make test-slow PYTEST_ARGS="--junitxml=$RUNNER_TEMP/pytest.xml"

      - name: Check skips against the slow tier's allowlist
        run: uv run python tools/check_skips.py "$RUNNER_TEMP/pytest.xml" --tier slow

      # The reproducible-rebuild control in its ~6s miniature: build the bounded
      # Federal Register release twice into scratch roots and require the two
      # trees to be byte-identical, apart from the one measurements file the
      # comparator names. Its inputs arrive with the pinned inputs (REF-071).
      - name: FR double-build determinism gate
        run: make determinism-atlas-federal-register-thesaurus

  full-atlas-tier:
    name: Full-Atlas tier
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # One worker holding the complete topology reaches ~10 GB. A larger runner
    # can be named with the REFSPEC_FULL_ATLAS_RUNNER repository variable.
    runs-on: ${{ vars.REFSPEC_FULL_ATLAS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up with the pinned inputs
        uses: ./.github/actions/pinned-setup
        with:
          r2-access-key-id: ${{ secrets.REFSPEC_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.REFSPEC_R2_SECRET_ACCESS_KEY }}

      # pytest exits non-zero when the tier selects nothing, so an emptied tier
      # fails here instead of passing silently.
      - name: Run the full-Atlas tier
        run: make test-full-atlas PYTEST_ARGS="--junitxml=$RUNNER_TEMP/pytest.xml"

      - name: Check skips against the full-Atlas tier's allowlist
        run: uv run python tools/check_skips.py "$RUNNER_TEMP/pytest.xml" --tier full-atlas
